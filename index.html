<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Engineering Academy</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#17253c;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(110deg,#132a50,#254f87);color:white;padding:30px max(20px,calc((100vw - 1120px)/2))}header h1{margin:0;font-size:30px}header p{opacity:.8;margin:8px 0 0}main{max-width:1120px;margin:25px auto;padding:0 18px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}button,.btn{border:0;border-radius:10px;padding:10px 14px;background:#e5ecf7;color:#17345b;cursor:pointer;font-weight:650}button:hover{filter:brightness(.95)}button.active,.primary{background:#245da5;color:white}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:15px}.card,.panel{background:white;border:1px solid #e0e8f2;border-radius:16px;padding:20px;box-shadow:0 3px 15px #183c6610}.metric{font-size:30px;font-weight:750;color:#194f91;margin:8px 0}.muted{color:#64748b;font-size:13px}.panel{margin-top:18px}h2{font-size:21px;margin:0 0 16px}h3{margin:0 0 9px}progress{width:100%;height:13px;accent-color:#2471bd}.subject{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:17px 0;border-bottom:1px solid #e8edf4}.subject:last-child{border:0}.tag{font-size:12px;padding:4px 8px;border-radius:20px;background:#e8f1fd;color:#1e5c99;display:inline-block;margin-top:6px}.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:650}input,select{padding:9px;border:1px solid #cbd6e5;border-radius:9px;background:white;color:#17253c;min-width:110px}input[type=date]{min-width:150px}.small{font-size:13px}.hide{display:none}table{width:100%;border-collapse:collapse}th,td{padding:12px;text-align:left;border-bottom:1px solid #e7edf5;font-size:14px}th{color:#52637b;background:#f7f9fc}.scroll{overflow:auto}.lesson{padding:12px 0;border-bottom:1px solid #e8edf4}.lesson:last-child{border:0}.lesson label{display:flex;gap:10px;align-items:center;cursor:pointer}.lesson input{min-width:auto}.notice{padding:13px;border-radius:10px;background:#edf5ff;color:#234c78;font-size:14px;margin:12px 0}.danger{background:#fbe7e7;color:#982b2b}.footer{text-align:center;color:#8290a3;padding:25px}.sectionlabel{font-size:13px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:#667a95;margin:22px 0 6px}@media(max-width:600px){header{padding:25px 18px}header h1{font-size:25px}.subject{grid-template-columns:1fr}th,td{padding:8px}}
.lessongrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:9px;margin-top:18px}.lessonpick{text-align:left;line-height:1.45}.reading{font-size:16px;line-height:1.7;color:#2d405a}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#10253e;color:#e5f1ff;padding:16px;border-radius:12px;line-height:1.6}.quizopt{display:block;margin:8px 0;padding:10px;border:1px solid #dce6f2;border-radius:8px}.quizopt input{min-width:0}hr{border:0;border-top:1px solid #e4eaf2;margin:20px 0}a.btn{text-decoration:none;display:inline-flex;align-items:center}@media print{nav,button,.lessongrid,header,.footer{display:none!important}.panel{box-shadow:none;border:0}} </style></head><body><header><h1>🎓 My Engineering Academy</h1><p>Ingegneria Informatica · Percorso universitario applicativo · Libretto personale</p></header><main><nav id="nav"><button data-tab="dashboard" class="active">🏠 Dashboard</button><button data-tab="piano">📚 Piano di studi</button><button data-tab="lezioni">🎧 Lezioni</button><button data-tab="libretto">📝 Libretto</button><button data-tab="programma">🗂️ Programmi</button><button data-tab="dati">⚙️ Dati e backup</button></nav><div id="content"></div></main><div class="footer">Percorso di autoformazione · Non conferisce un titolo universitario ufficiale</div><script>
const subjects=[{"id": 1, "name": "Fondamenti di informatica e programmazione", "weeks": 10, "group": "Fondamenti informatici", "desc": "Informazione digitale, hardware, software, primi programmi Python"}, {"id": 2, "name": "Algoritmi e strutture dati", "weeks": 8, "group": "Fondamenti informatici", "desc": "Algoritmi, complessità, array, liste, pile, code, alberi"}, {"id": 3, "name": "Architettura dei calcolatori e reti logiche", "weeks": 6, "group": "Fondamenti informatici", "desc": "CPU, memoria, istruzioni, porte logiche, circuiti"}, {"id": 4, "name": "Basi di dati e SQL avanzato", "weeks": 6, "group": "Sistemi e software", "desc": "Modello relazionale, join, normalizzazione, indici, transazioni"}, {"id": 5, "name": "Programmazione a oggetti", "weeks": 8, "group": "Sistemi e software", "desc": "Classi, oggetti, ereditarietà, interfacce e test"}, {"id": 6, "name": "Sistemi operativi", "weeks": 6, "group": "Sistemi e software", "desc": "Processi, thread, memoria virtuale, filesystem e permessi"}, {"id": 7, "name": "Reti di calcolatori e Internet", "weeks": 6, "group": "Sistemi e software", "desc": "TCP/IP, DNS, HTTP, routing e diagnostica"}, {"id": 8, "name": "Ingegneria del software", "weeks": 8, "group": "Sistemi e software", "desc": "Requisiti, Git, testing, progettazione, CI/CD"}, {"id": 9, "name": "Sviluppo di applicazioni e servizi web", "weeks": 8, "group": "Applicazioni e tecnologie", "desc": "Frontend, backend, API REST, autenticazione"}, {"id": 10, "name": "Fondamenti di elettronica e automazione", "weeks": 6, "group": "Applicazioni e tecnologie", "desc": "Segnali, sensori, logica di controllo e automazione"}, {"id": 11, "name": "Cloud computing e cybersecurity", "weeks": 8, "group": "Applicazioni e tecnologie", "desc": "Servizi cloud, container, sicurezza e backup"}, {"id": 12, "name": "Intelligenza artificiale e machine learning", "weeks": 10, "group": "Applicazioni e tecnologie", "desc": "Dati, modelli, valutazione, apprendimento supervisionato"}, {"id": 13, "name": "Progetto finale interdisciplinare", "weeks": 10, "group": "Progetto conclusivo", "desc": "Progetto completo dalla specifica al rilascio"}];
const lessonData=[{"title": "Che cos’è l’informatica?", "goal": "Distinguere dati, informazione, algoritmo e programma.", "theory": ["L’informatica studia la rappresentazione e l’elaborazione automatica dell’informazione. Non coincide con il semplice uso del computer: comprende metodi, algoritmi, strutture dati e sistemi.", "Un dato è una rappresentazione grezza, per esempio 15320. Diventa informazione quando ne conosciamo significato e contesto: 15.320 ore lavorate da un mezzo.", "Un algoritmo è una sequenza finita e non ambigua di passi per risolvere un problema. Un programma è l’implementazione di uno o più algoritmi in un linguaggio eseguibile da un sistema."], "example": "Dato: 15320. Regola: se ore > 15000, segnalare manutenzione. Risultato: mezzo da verificare.", "exercise": "Scrivi un algoritmo in 5–7 passi che, dati i consumi di tre mezzi, identifichi quello con il consumo maggiore.", "quiz": ["Quale affermazione è corretta?", ["Un algoritmo deve essere scritto in Python", "Un algoritmo è una procedura finita e non ambigua", "Un database è sempre un algoritmo"], 1]}, {"title": "Bit, byte e sistema binario", "goal": "Comprendere come i numeri vengono rappresentati in base 2.", "theory": ["Un bit può assumere i valori 0 oppure 1. Otto bit formano un byte. I calcolatori codificano numeri, testi e immagini usando sequenze di bit.", "In base 10 ogni posizione vale una potenza di 10. In base 2 ogni posizione vale una potenza di 2: 1, 2, 4, 8, 16 e così via.", "Per convertire 13 in binario: 13 = 8 + 4 + 1, quindi 1101. Per tornare in decimale: 1×8 + 1×4 + 0×2 + 1×1 = 13."], "example": "10110₂ = 16 + 4 + 2 = 22₁₀. Un byte contiene 8 bit.", "exercise": "Converti 19 e 42 in binario. Converti 10101₂ in decimale. Spiega la differenza tra bit e byte.", "quiz": ["Quanto vale 1010₂ in decimale?", ["8", "10", "12"], 1]}, {"title": "Come funziona un computer", "goal": "Identificare CPU, RAM, memoria persistente e periferiche.", "theory": ["La CPU esegue istruzioni: preleva un’istruzione dalla memoria, la decodifica e la esegue. Questo ciclo è spesso chiamato fetch–decode–execute.", "La RAM ospita temporaneamente dati e istruzioni dei programmi in esecuzione. SSD e dischi conservano i dati anche a dispositivo spento.", "Le periferiche permettono input e output. La scheda madre e i bus collegano i componenti. Prestazioni e capacità dipendono da più fattori, non soltanto dalla frequenza della CPU."], "example": "Aprire un foglio di calcolo: il sistema carica istruzioni e dati dalla memoria persistente alla RAM; la CPU esegue le operazioni; il display mostra il risultato.", "exercise": "Disegna uno schema con CPU, RAM, SSD, tastiera e monitor e indica con frecce il percorso dei dati quando apri un file.", "quiz": ["Quale componente conserva i file a computer spento?", ["RAM", "SSD", "Cache della CPU"], 1]}, {"title": "Sistemi operativi e programmi", "goal": "Capire come il sistema operativo gestisce le risorse.", "theory": ["Il sistema operativo coordina hardware e software: gestisce processi, memoria, file, dispositivi e autorizzazioni.", "Un processo è un programma in esecuzione con risorse e uno spazio di memoria. L’interfaccia grafica è soltanto una delle modalità di interazione; esiste anche il terminale.", "Un compilatore traduce codice sorgente in una forma eseguibile o intermedia; un interprete esegue istruzioni attraverso un ambiente software. Python usa normalmente un interprete con compilazione intermedia in bytecode."], "example": "Quando apri un’app, il sistema operativo crea uno o più processi, assegna memoria e coordina accesso a file e periferiche.", "exercise": "Individua tre attività svolte dal sistema operativo mentre usi contemporaneamente browser, musica e un documento.", "quiz": ["Quale compito appartiene al sistema operativo?", ["Gestire processi e memoria", "Scegliere i contenuti di un sito", "Scrivere automaticamente gli algoritmi"], 0]}, {"title": "Primi passi con Python", "goal": "Leggere ed eseguire semplici istruzioni Python.", "theory": ["Python è un linguaggio di programmazione ad alto livello. Le istruzioni vengono eseguite secondo il flusso del programma, salvo strutture di controllo.", "print() mostra un valore; input() legge testo inserito dall’utente. I commenti iniziano con # e servono a documentare il codice.", "Gli errori di sintassi impediscono l’esecuzione; gli errori logici possono produrre risultati sbagliati pur con codice formalmente valido."], "example": "nome = \"Ada\"\nprint(\"Ciao\", nome)\n# Stampa: Ciao Ada", "exercise": "Scrivi un programma che visualizzi il tuo nome e il messaggio “Benvenuto al corso di Ingegneria Informatica”.", "quiz": ["A cosa serve print()?", ["A leggere file", "A visualizzare output", "A creare una variabile"], 1]}, {"title": "Variabili, tipi e operatori", "goal": "Usare variabili numeriche, stringhe e operazioni.", "theory": ["Una variabile associa un nome a un valore. In Python il tipo è associato all’oggetto: int per interi, float per decimali, str per testo, bool per vero/falso.", "Gli operatori aritmetici includono +, -, *, /, //, % e **. Il simbolo = assegna un valore; == confronta due valori.", "La conversione dei tipi è importante: input() restituisce testo. Per calcolare con il valore inserito occorre, quando appropriato, convertirlo con int() o float()."], "example": "ore = 15320\nsoglia = 15000\nsuperata = ore > soglia\nprint(superata)  # True", "exercise": "Crea variabili per ore lavorate e costo orario, quindi calcola e stampa il costo totale.", "quiz": ["Quale operatore confronta due valori in Python?", ["=", "==", "=>"], 1]}, {"title": "Condizioni e logica booleana", "goal": "Costruire decisioni con if, elif, else, and, or, not.", "theory": ["Le condizioni consentono di scegliere percorsi diversi. In Python l’indentazione definisce i blocchi di codice.", "and richiede che entrambe le condizioni siano vere; or richiede che almeno una sia vera; not inverte un valore booleano.", "L’ordine delle condizioni conta: nei rami if/elif viene eseguito il primo blocco la cui condizione risulta vera."], "example": "ore = 15320\nif ore > 15000:\n    print(\"Controllo richiesto\")\nelse:\n    print(\"Nessun controllo\")", "exercise": "Scrivi un programma che assegni “Alta”, “Media” o “Bassa” priorità in base a tre intervalli di ore lavorate che definisci tu.", "quiz": ["Con A=True e B=False, quanto vale A and B?", ["True", "False", "Errore"], 1]}, {"title": "Cicli e iterazioni", "goal": "Ripetere operazioni con for e while.", "theory": ["Un ciclo for percorre una sequenza di valori; range(5) produce 0, 1, 2, 3, 4. Il limite superiore è escluso.", "Un ciclo while ripete le istruzioni finché una condizione è vera. È necessario che la condizione possa diventare falsa per evitare cicli infiniti.", "L’iterazione riduce le ripetizioni di codice e permette di elaborare raccolte di dati di dimensioni variabili."], "example": "ore_mezzi = [12000, 15320, 18100]\nfor ore in ore_mezzi:\n    if ore > 15000:\n        print(ore)", "exercise": "Dato un elenco di cinque valori, stampa solo quelli maggiori di 100 e conta quanti sono.", "quiz": ["Cosa produce range(3)?", ["1,2,3", "0,1,2", "0,1,2,3"], 1]}, {"title": "Funzioni e strutture dati", "goal": "Organizzare il codice e gestire liste e dizionari.", "theory": ["Una funzione raccoglie istruzioni riutilizzabili, può ricevere parametri e restituire un risultato con return.", "Una lista contiene elementi ordinati e modificabili. Un dizionario associa chiavi a valori, utile per rappresentare oggetti con attributi.", "Separare dati e logica in funzioni facilita test, manutenzione e riuso."], "example": "def media(valori):\n    return sum(valori) / len(valori)\n\nmezzo = {\"id\": \"M01\", \"ore\": 15320}\nprint(media([10, 20, 30]))", "exercise": "Scrivi una funzione supera_soglia(ore, soglia) che restituisca True o False. Applicala a tre mezzi.", "quiz": ["Quale parola chiave restituisce un risultato da una funzione?", ["print", "return", "for"], 1]}, {"title": "Mini-progetto e verifica", "goal": "Integrare i concetti del modulo in un piccolo programma.", "theory": ["Progetto: un registro semplificato di mezzi industriali con identificativo e ore lavorate. Il programma deve identificare quelli oltre una soglia.", "Organizza i dati in una lista di dizionari, usa una funzione per verificare la soglia e un ciclo per esaminare tutti i mezzi.", "Verifica almeno tre casi: nessun mezzo oltre soglia, un solo mezzo oltre soglia e più mezzi oltre soglia. Descrivi limiti e possibili miglioramenti."], "example": "mezzi = [{\"id\":\"M01\",\"ore\":12000},{\"id\":\"M02\",\"ore\":15320}]\nfor mezzo in mezzi:\n    if mezzo[\"ore\"] > 15000:\n        print(mezzo[\"id\"])", "exercise": "Realizza il mini-progetto completo e consegna codice, breve descrizione e tre test eseguiti.", "quiz": ["Qual è una buona verifica del programma?", ["Provare un solo dato", "Provare casi limite e diversi scenari", "Evitare di eseguirlo"], 1]}];const defaultLessons=lessonData.map(l=>l.title);
const key='my_engineering_academy_v1';let state;try{state=JSON.parse(localStorage.getItem(key))||{}}catch(e){state={}};state.subjects ||= {};state.lessons ||= {};let tab='dashboard';let selectedLesson=0;const el=document.getElementById('content');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){console.warn('Salvataggio locale non disponibile',e)}}function rec(id){return state.subjects[id]||{status:'Da iniziare',grade:'',date:'',honors:false}}function passed(r){return r.status==='Completato'&&Number(r.grade)>=18&&Number(r.grade)<=30}function average(){let v=subjects.map(s=>rec(s.id)).filter(passed);return v.length?(v.reduce((a,r)=>a+Number(r.grade),0)/v.length).toFixed(2):'—'}function completed(){return subjects.filter(s=>passed(rec(s.id))).length}function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));el.innerHTML=({dashboard:dashboard,piano:piano,lezioni:lezioni,libretto:libretto,programma:programma,dati:dati})[tab]();bind()}
function dashboard(){let done=completed(),inprogress=subjects.filter(s=>rec(s.id).status==='In corso').length,perc=Math.round(done/subjects.length*100);return `<div class="cards"><div class="card"><div class="muted">Esami superati</div><div class="metric">${done}/${subjects.length}</div></div><div class="card"><div class="muted">Media aritmetica</div><div class="metric">${average()}<span class="small"> /30</span></div></div><div class="card"><div class="muted">Insegnamenti in corso</div><div class="metric">${inprogress}</div></div><div class="card"><div class="muted">Avanzamento</div><div class="metric">${perc}%</div></div></div><div class="panel"><h2>Il tuo percorso</h2><progress max="100" value="${perc}"></progress><p class="muted">${done} insegnamenti superati su ${subjects.length}. Il progresso è calcolato sugli esami registrati come superati.</p><div class="notice">📍 Punto di partenza: test d'ingresso svolto · Preparazione logico-matematica buona · Programmazione livello principiante · Impegno previsto 4–5 ore a settimana.</div></div><div class="panel"><h2>Prossimo passo</h2><h3>Fondamenti di informatica e programmazione</h3><p>Apri la sezione <b>Lezioni</b> per seguire il programma iniziale e segnare quelle completate. Potrai aggiungere i materiali quando saranno disponibili.</p><button class="primary" data-goto="lezioni">Vai alle lezioni →</button></div>`}
function piano(){let groups=[...new Set(subjects.map(s=>s.group))];return `<div class="panel"><h2>Piano di studi</h2><p class="muted">13 insegnamenti · 100 settimane didattiche indicative. Seleziona lo stato di ogni materia; i voti si registrano nel Libretto.</p>${groups.map(g=>`<div class="sectionlabel">${esc(g)}</div>${subjects.filter(s=>s.group===g).map(s=>{let r=rec(s.id);return `<div class="subject"><div><b>${s.id.toString().padStart(2,'0')}. ${esc(s.name)}</b><div class="muted">${s.weeks} settimane indicative · ${esc(s.desc)}</div><span class="tag">${esc(r.status)}${passed(r)?' · '+r.grade+(r.honors?' e lode':'')+'/30':''}</span></div><div class="row"><select aria-label="Stato ${esc(s.name)}" data-status="${s.id}">${['Da iniziare','In corso','Completato'].map(x=>`<option ${r.status===x?'selected':''}>${x}</option>`).join('')}</select><button data-exam="${s.id}">Esame</button></div></div>`}).join('')}`).join('')}</div>`}
function lezioni(){let n=lessonData.filter((_,i)=>state.lessons[i]).length;let l=lessonData[selectedLesson];return `<div class="panel"><h2>Lezioni · Modulo 1</h2><p>Fondamenti di informatica e programmazione · 10 unità didattiche</p><p class="muted">${n}/10 lezioni completate · Seleziona una lezione per visualizzare teoria, esempio, esercizio e ascolto</p><progress max="10" value="${n}"></progress><div class="lessongrid">${lessonData.map((x,i)=>`<button class="lessonpick ${selectedLesson===i?'active':''}" data-pick="${i}">${state.lessons[i]?'✓ ':''}1.${i+1} ${esc(x.title)}</button>`).join('')}</div></div><div class="panel"><div class="muted">LEZIONE 1.${selectedLesson+1} · MATERIALE DI STUDIO</div><h2>${esc(l.title)}</h2><div class="notice"><b>Obiettivo:</b> ${esc(l.goal)}</div><div class="row"><button class="primary" id="speak">🔊 Ascolta la lezione</button><button id="stopSpeak">⏹ Interrompi</button><button id="printLesson">🖨 Stampa</button></div><p class="muted">L'ascolto usa la sintesi vocale del browser, se disponibile. Su iPhone potrebbe dipendere dal browser e dalle impostazioni audio.</p><h3>Spiegazione</h3>${l.theory.map(t=>`<p class="reading">${esc(t)}</p>`).join('')}<h3>Esempio guidato</h3><pre>${esc(l.example)}</pre><h3>Esercitazione</h3><p class="reading">${esc(l.exercise)}</p><h3>Domanda di autovalutazione</h3><p>${esc(l.quiz[0])}</p>${l.quiz[1].map((a,i)=>`<label class="quizopt"><input type="radio" name="q" value="${i}"> ${String.fromCharCode(65+i)}) ${esc(a)}</label>`).join('')}<button id="checkQuiz">Verifica risposta</button><div id="quizResult" aria-live="polite"></div><hr><label class="row"><input type="checkbox" data-lesson="${selectedLesson}" ${state.lessons[selectedLesson]?'checked':''}> Segna questa lezione come completata</label></div><div class="panel"><h2>Materiali scaricabili · Modulo 1</h2><p>Le slide e la dispensa raccolgono tutte le 10 lezioni del primo modulo.</p><div class="row"><a class="btn primary" href="Modulo_1_Slide.pptx" download>📊 Slide PowerPoint</a><a class="btn" href="Modulo_1_Dispensa.pdf" download>📖 Dispensa PDF</a></div><p class="muted">Per usare i collegamenti offline, mantieni HTML, PDF e PPTX nella stessa cartella oppure estrai il pacchetto ZIP completo.</p></div>`}function programma(){return `<div class="panel"><h2>Programma completo del percorso</h2><p class="muted">13 insegnamenti · 100 settimane indicative · 4–5 ore settimanali. Il calendario è adattabile e non equivale a un corso accreditato.</p>${subjects.map(s=>`<div class="subject"><div><b>${s.id.toString().padStart(2,'0')} · ${esc(s.name)}</b><div class="muted">${esc(s.group)} · ${s.weeks} settimane</div><p class="small">${esc(s.desc)}</p>${s.id===1?'<span class="tag">Materiale disponibile: 10 lezioni, slide e dispensa</span>':'<span class="tag">Materiale in preparazione</span>'}</div>${s.id===1?'<button data-goto="lezioni">Apri lezioni</button>':''}</div>`).join('')}</div>`}function lessonSpeechText(l){return [l.title,l.goal,...l.theory,'Esempio guidato.',l.example,'Esercitazione.',l.exercise].join('. ')}
function libretto(){let rows=subjects.map(s=>({s,r:rec(s.id)})).filter(x=>passed(x.r));return `<div class="panel"><h2>Libretto degli esami</h2><div class="cards"><div><div class="muted">Esami superati</div><div class="metric">${rows.length}</div></div><div><div class="muted">Media aritmetica</div><div class="metric">${average()}</div></div></div><div class="scroll"><table><thead><tr><th>Insegnamento</th><th>Data</th><th>Voto</th><th></th></tr></thead><tbody>${rows.length?rows.map(({s,r})=>`<tr><td>${esc(s.name)}</td><td>${esc(r.date||'—')}</td><td><b>${r.grade}/30${r.honors?' e lode':''}</b></td><td><button data-exam="${s.id}">Modifica</button></td></tr>`).join(''):'<tr><td colspan="4">Nessun esame ancora registrato.</td></tr>'}</tbody></table></div><p class="muted">La lode è mostrata nel libretto, ma per la media aritmetica vale 30. Gli esami senza voto valido non sono conteggiati.</p></div><div class="panel"><h2>Registra un esame</h2><div class="row"><select id="examChoice">${subjects.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><button class="primary" id="openExam">Inserisci voto</button></div></div>`}
function dati(){return `<div class="panel"><h2>Salvataggio e backup</h2><p>I dati sono salvati nel browser di questo dispositivo tramite localStorage. Non vengono inviati a un server e non si sincronizzano automaticamente tra dispositivi.</p><div class="row"><button class="primary" id="export">⬇ Esporta backup JSON</button><label class="btn" for="import">⬆ Importa backup</label><input id="import" type="file" accept="application/json,.json" class="hide"></div><div class="notice">Importante: esporta regolarmente il backup. Cancellando i dati del browser o usando un altro dispositivo potresti non ritrovare il libretto.</div><button class="danger" id="reset">Azzera tutti i dati</button></div>`}
function exam(id){let s=subjects.find(x=>x.id===Number(id)),r=rec(id);let d=document.createElement('dialog');d.style.cssText='border:0;border-radius:16px;padding:25px;max-width:500px;width:calc(100% - 30px);box-shadow:0 15px 70px #0005';d.innerHTML=`<h2>Esame · ${esc(s.name)}</h2><form method="dialog" id="examForm"><div class="row"><label class="field">Voto (18–30)<input name="grade" type="number" min="18" max="30" step="1" value="${esc(r.grade)}" required></label><label class="field">Data esame<input name="date" type="date" value="${esc(r.date)}"></label></div><p><label><input type="checkbox" name="honors" ${r.honors?'checked':''}> 30 e lode</label></p><p class="muted">Salvando un voto valido, l'insegnamento sarà contrassegnato come completato.</p><div class="row"><button type="button" id="cancelExam">Annulla</button><button type="submit" class="primary">Salva esame</button><button type="button" id="deleteExam" class="danger">Elimina voto</button></div></form>`;document.body.append(d);d.showModal();d.querySelector('#cancelExam').onclick=()=>d.close();d.querySelector('#deleteExam').onclick=()=>{state.subjects[id]={...r,grade:'',date:'',honors:false,status:'Da iniziare'};save();d.close();render()};d.querySelector('form').onsubmit=e=>{e.preventDefault();let f=e.currentTarget,grade=Number(f.grade.value);if(!Number.isInteger(grade)||grade<18||grade>30){alert('Inserisci un voto intero da 18 a 30.');return}state.subjects[id]={status:'Completato',grade:String(grade),date:f.date.value,honors:f.honors.checked&&grade===30};save();d.close();render()};d.onclose=()=>d.remove()}
function bind(){document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{tab=b.dataset.goto;render()});document.querySelectorAll('[data-status]').forEach(x=>x.onchange=()=>{let r=rec(x.dataset.status);state.subjects[x.dataset.status]={...r,status:x.value};save();render()});document.querySelectorAll('[data-lesson]').forEach(x=>x.onchange=()=>{state.lessons[x.dataset.lesson]=x.checked;save();render()});document.querySelectorAll('[data-pick]').forEach(x=>x.onclick=()=>{if(window.speechSynthesis) speechSynthesis.cancel();selectedLesson=Number(x.dataset.pick);render()});if(document.getElementById('speak'))document.getElementById('speak').onclick=()=>{if(!('speechSynthesis' in window)){alert('Sintesi vocale non disponibile in questo browser.');return;}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(lessonSpeechText(lessonData[selectedLesson]));u.lang='it-IT';u.rate=.9;speechSynthesis.speak(u)};if(document.getElementById('stopSpeak'))document.getElementById('stopSpeak').onclick=()=>speechSynthesis?.cancel();if(document.getElementById('printLesson'))document.getElementById('printLesson').onclick=()=>window.print();if(document.getElementById('checkQuiz'))document.getElementById('checkQuiz').onclick=()=>{let a=document.querySelector('input[name=q]:checked');document.getElementById('quizResult').innerHTML=a?(Number(a.value)===lessonData[selectedLesson].quiz[2]?'<div class=notice>✓ Risposta corretta!</div>':'<div class=notice>Non è la risposta corretta. Rileggi la spiegazione e riprova.</div>'):'<div class=notice>Seleziona una risposta.</div>'};document.querySelectorAll('[data-exam]').forEach(b=>b.onclick=()=>exam(b.dataset.exam));if(document.getElementById('openExam'))document.getElementById('openExam').onclick=()=>exam(document.getElementById('examChoice').value);if(document.getElementById('export'))document.getElementById('export').onclick=()=>{let blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='My_Engineering_Academy_backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};if(document.getElementById('import'))document.getElementById('import').onchange=async e=>{try{let o=JSON.parse(await e.target.files[0].text());if(!o.state||typeof o.state!=='object'||typeof o.state.subjects!=='object')throw Error('Formato non valido');if(!confirm('Sostituire i dati attuali con quelli del backup?'))return;state={subjects:o.state.subjects,lessons:o.state.lessons||{}};save();render()}catch(err){alert('Backup non valido: '+err.message)}};if(document.getElementById('reset'))document.getElementById('reset').onclick=()=>{if(confirm('Eliminare definitivamente tutti i dati locali? Esporta prima un backup.')){state={subjects:{},lessons:{}};save();render()}}}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();
</script></body></html>
